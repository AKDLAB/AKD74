# Keeps the Publications and People pages up to date with Google Scholar:
# every Monday morning (India time), and whenever "Run workflow" is pressed
# on the Actions tab. Commits only when something changed; GitHub Pages then
# republishes the site.
name: Update from Google Scholar

on:
  schedule:
    - cron: "30 2 * * 1"   # Mondays 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read Google Scholar and rebuild the pages
        env:
          TZ: Asia/Kolkata
        run: python3 tools/update_scholar.py

      - name: Publish if anything changed
        run: |
          if git diff --quiet; then
            echo "Nothing new on Google Scholar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html people.html
          git commit -m "Update citations and publications from Google Scholar"
          git push
